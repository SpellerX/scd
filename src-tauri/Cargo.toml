[package]
name = "scd"
version = "0.2.3"
description = "SCD — Sistema de Controle de Demandas"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# Runtime async para o teste de integração real (sincronização com a nuvem).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
bcrypt = "0.19.3"
reqwest = "0.13.4"
calamine = "0.36.1"
tauri-plugin-dialog = "2.7.3"
tokio = { version = "1.53.1", features = ["time"] }
getrandom = "0.4.3"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
uuid = { version = "1", features = ["v4", "v5"] }
dotenvy = "0.15"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
